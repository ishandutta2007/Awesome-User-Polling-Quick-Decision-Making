<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes barPulse1 {
      0%, 100% { width: 140px; }
      50% { width: 185px; }
    }
    @keyframes barPulse2 {
      0%, 100% { width: 220px; }
      50% { width: 260px; }
    }
    @keyframes barPulse3 {
      0%, 100% { width: 95px; }
      50% { width: 135px; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-18px) scale(1.15); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes subtleGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }

    .dyn-bar-1 { animation: barPulse1 4s ease-in-out infinite; }
    .dyn-bar-2 { animation: barPulse2 4.8s ease-in-out infinite; }
    .dyn-bar-3 { animation: barPulse3 3.6s ease-in-out infinite; }
    .dyn-particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .dyn-particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .dyn-glow { animation: subtleGlow 6s ease-in-out infinite alternate; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Glow Background Blobs -->
  <circle class="dyn-glow" cx="950" cy="180" r="160" fill="url(#glowG)" filter="url(#shadowGlow)" />
  <circle class="dyn-glow" cx="150" cy="90" r="120" fill="url(#glowG)" filter="url(#shadowGlow)" />

  <!-- Floating Dynamic Particle Dots in Background -->
  <circle class="dyn-particle-1" cx="680" cy="90" r="3" fill="#38bdf8" />
  <circle class="dyn-particle-2" cx="720" cy="280" r="4" fill="#a855f7" />
  <circle class="dyn-particle-1" cx="1140" cy="80" r="3.5" fill="#34d399" />
  <circle class="dyn-particle-2" cx="1110" cy="310" r="3" fill="#60a5fa" />
  <circle class="dyn-particle-1" cx="620" cy="210" r="2.5" fill="#f472b6" />

  <!-- RIGHT SIDE: Interactive Polling & Decision Visual Dashboard (Placed Behind/Alongside Text) -->
  <g transform="translate(730, 55)">
    <!-- Dashboard Mockup Card -->
    <rect x="0" y="0" width="420" height="250" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Window Bar Controls -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5">LIVE AUDIENCE POLLING &amp; CONSENSUS</text>
    <line x1="0" y1="40" x2="420" y2="40" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Active Question -->
    <text x="24" y="68" fill="#f8fafc" font-size="13" font-weight="600">Q: Preferred consensus for next sprint release?</text>
    <text x="345" y="68" fill="#38bdf8" font-size="11" font-weight="700">● 1,420 votes</text>

    <!-- Option 1: Live Polling Bar -->
    <g transform="translate(24, 88)">
      <text x="0" y="14" fill="#94a3b8" font-size="12" font-weight="500">Fast Async Voting (Rallly / Slido)</text>
      <text x="330" y="14" fill="#38bdf8" font-size="12" font-weight="700">62%</text>
      <!-- Base Bar -->
      <rect x="0" y="22" width="370" height="10" rx="5" fill="rgba(255, 255, 255, 0.06)" />
      <!-- Animated Fill Bar -->
      <rect class="dyn-bar-2" x="0" y="22" width="230" height="10" rx="5" fill="url(#accentCyan)" />
    </g>

    <!-- Option 2: Live Polling Bar -->
    <g transform="translate(24, 138)">
      <text x="0" y="14" fill="#94a3b8" font-size="12" font-weight="500">Interactive Slides (Mentimeter / Claper)</text>
      <text x="330" y="14" fill="#c084fc" font-size="12" font-weight="700">26%</text>
      <!-- Base Bar -->
      <rect x="0" y="22" width="370" height="10" rx="5" fill="rgba(255, 255, 255, 0.06)" />
      <!-- Animated Fill Bar -->
      <rect class="dyn-bar-1" x="0" y="22" width="140" height="10" rx="5" fill="url(#accentPurple)" />
    </g>

    <!-- Option 3: Live Polling Bar -->
    <g transform="translate(24, 188)">
      <text x="0" y="14" fill="#94a3b8" font-size="12" font-weight="500">Collaborative Consensus (Loomio / Decidim)</text>
      <text x="330" y="14" fill="#34d399" font-size="12" font-weight="700">12%</text>
      <!-- Base Bar -->
      <rect x="0" y="22" width="370" height="10" rx="5" fill="rgba(255, 255, 255, 0.06)" />
      <!-- Animated Fill Bar -->
      <rect class="dyn-bar-3" x="0" y="22" width="95" height="10" rx="5" fill="url(#accentGreen)" />
    </g>
  </g>

  <!-- LEFT SIDE: FOREGROUND TITLE, SUBTITLE & BADGES (Clean & Sharp Foreground) -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="265" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title (Strictly Foregrounded) -->
    <text x="0" y="72" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      User Polling &amp; Quick
    </text>
    <text x="0" y="114" fill="url(#accentCyan)" font-size="34" font-weight="800" letter-spacing="-0.5">
      Decision Making
    </text>

    <!-- Subtitle (Clear Foreground Description) -->
    <text x="0" y="152" fill="#94a3b8" font-size="15" font-weight="400">
      Top commercial SaaS leaders &amp; self-hosted open-source alternatives
    </text>
    <text x="0" y="174" fill="#64748b" font-size="13.5" font-weight="400">
      Live audience interaction, scheduling polls, consensus voting &amp; surveys.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 202)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="120" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="60" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">⚡ Real-Time Polls</text>

      <!-- Tag 2 -->
      <rect x="130" y="0" width="130" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="195" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">📅 Meeting Finding</text>

      <!-- Tag 3 -->
      <rect x="270" y="0" width="135" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="337" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">🔒 Self-Hostable FOSS</text>

      <!-- Tag 4 -->
      <rect x="415" y="0" width="135" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="482" y="17" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">📊 Audience Insights</text>
    </g>
  </g>
</svg>
